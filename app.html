<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combak · app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Combak app : fond bleu glacier, encre nuit, bleu électrique pour l'action, corail réservé au logo et aux récompenses. Layout : menu latéral + contenu, carte 3D au centre des écrans client. */
  --bg:#F3F6FF; --paper:#FFFFFF; --line:#DCE3FA; --soft:#E8EEFF;
  --ink:#0B1033; --ink-2:#424A72; --ink-3:#5F6890;
  --blue:#2F5BFF; --blue-deep:#2448E8; --navy:#070B24; --coral:#FF5A3C;
  --good:#127A57; --good-bg:#DDF3EA; --warn:#8A5A00; --warn-bg:#FFF0C7; --bad:#B3261E; --bad-bg:#FDE4E1;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --body:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);letter-spacing:-0.02em;line-height:1.1;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.logo{display:inline-flex;align-items:baseline;font-family:var(--display);font-weight:800;letter-spacing:-0.045em;line-height:1}
.logo svg{width:.56em;height:.56em;margin:0 .02em}

/* Connexion */
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.auth-side{background:var(--navy);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;overflow:hidden}
.auth-side .glow{position:absolute;width:560px;height:560px;border-radius:50%;background:var(--blue);filter:blur(90px);opacity:.45;top:-160px;left:-160px;animation:drift 18s ease-in-out infinite}
@keyframes drift{50%{transform:translate(120px,90px) scale(1.1)}}
.auth-main{padding:48px 24px;display:flex;align-items:center;justify-content:center}
.auth-box{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px}
@media (max-width:900px){.auth{grid-template-columns:minmax(0,1fr)}.auth-side{padding:28px 20px}.auth-side .big{display:none}}
.demo-acc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.demo-acc button{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-height:64px}
.demo-acc button:hover{border-color:var(--blue)}
.demo-acc b{font-size:14px}
.demo-acc span{font-size:12px;color:var(--ink-3)}

/* Shell */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 20px;background:rgba(243,246,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.spacer{flex:1}
.role{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--ink);color:#fff;white-space:nowrap}
.role.merchant{background:var(--blue)}
.role.staff{background:#6B4BFF}
.role.customer{background:var(--coral);color:var(--ink)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100% - 65px)}
.sidenav{border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:65px;align-self:start;height:calc(100vh - 65px)}
.tenant{display:flex;gap:10px;align-items:center;padding:6px 10px 18px}
.avatar{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:18px;flex:none}
.nav-btn{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:10px 12px;border-radius:12px;font-weight:600;color:var(--ink-2);text-align:left;width:100%}
.nav-btn svg{width:20px;height:20px;flex:none}
.nav-btn:hover{background:var(--soft);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--ink);color:#fff}
.main{padding:28px 32px 64px;min-width:0;display:flex;flex-direction:column;gap:24px;max-width:1240px}


/* Commun */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head h1{font-size:34px}
.page-head p{margin:6px 0 0;color:var(--ink-2);max-width:62ch}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px}
.panel h2{font-size:20px;margin-bottom:14px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.grid-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:900px){.grid-2,.grid-3{grid-template-columns:minmax(0,1fr)}.grid-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:-0.03em;line-height:1}
.kpi .l{font-size:13px;color:var(--ink-2);font-weight:500}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-deep)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#1A2257}
.btn-soft{background:var(--soft);color:var(--ink)}
.btn-soft:hover{background:#DCE5FF}
.btn-danger{background:var(--bad-bg);color:var(--bad)}
.btn-sm{padding:7px 12px;min-height:36px;font-size:14px}
.btn-block{width:100%}
.link{background:none;border:0;padding:0;color:var(--blue-deep);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--soft);color:var(--ink)}
.chip.coral{background:#FFE1D9;color:#A8301A}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field legend{font-weight:600;font-size:14px}
.input{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
.input:focus{outline:none;border-color:var(--blue)}
textarea.input{min-height:90px;resize:vertical}
.error{margin:0;color:var(--bad);font-weight:600;font-size:14px}
.note{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:16px;padding:14px 16px;font-size:14px}
.note svg{flex:none;width:20px;height:20px;margin-top:1px}
.note.good{background:var(--good-bg)}
.note.warn{background:var(--warn-bg)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:160px}
.bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar span{display:block;height:100%;background:var(--blue);border-radius:999px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:left;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.toggle{position:relative;width:48px;height:28px;flex:none;display:inline-block}
.toggle input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.toggle span{position:absolute;inset:0;background:#C9D1EE;border-radius:999px;transition:background .2s}
.toggle span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle input:checked + span{background:var(--good)}
.toggle input:checked + span::after{transform:translateX(20px)}
.toggle input:focus-visible + span{outline:3px solid var(--coral);outline-offset:2px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{position:relative;width:44px;height:44px}
.swatch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.swatch span{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(11,16,51,.15)}
.swatch input:checked + span{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--ink)}
.swatch input:focus-visible + span{outline:3px solid var(--coral);outline-offset:6px}
.yes{color:var(--good);font-weight:700}
.no{color:var(--ink-3)}
.chart svg{width:100%;height:auto;display:block}

/* Scanner */
.viewfinder{position:relative;height:220px;border-radius:24px;background:var(--navy);overflow:hidden;display:flex;align-items:center;justify-content:center;color:#C9D5FF;font-size:14px}
.viewfinder .frame{position:absolute;width:150px;height:150px}
.viewfinder .frame i{position:absolute;width:34px;height:34px;border:4px solid var(--blue)}
.viewfinder .frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.viewfinder .frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.viewfinder .frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 10px}
.viewfinder .frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.viewfinder .line{position:absolute;left:calc(50% - 70px);width:140px;height:2px;background:#7FA0FF;box-shadow:0 0 12px #7FA0FF;animation:scan 2.2s ease-in-out infinite}
.viewfinder .label{position:absolute;bottom:14px}
@keyframes scan{0%,100%{top:calc(50% - 66px)}50%{top:calc(50% + 66px)}}

/* Carte 3D */
.tilt-stage{perspective:1100px;touch-action:none;display:flex;align-items:center;justify-content:center;padding:14px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card-float{transform-style:preserve-3d}
.tilt-stage:not(.active) .card-float{animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:rotateX(8deg) rotateY(-12deg) translateY(0)}50%{transform:rotateX(-3deg) rotateY(12deg) translateY(-8px)}}
.card3d{--cw:340px;position:relative;width:var(--cw);max-width:100%;aspect-ratio:1.586;font-size:calc(var(--cw) / 23);transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(calc(var(--ry,0deg) + var(--flip,0deg)));transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.tilt-stage.active .card3d{transition:transform 90ms linear}
.card3d .edge{position:absolute;inset:0;border-radius:1.25em}
.card3d .face{position:absolute;inset:0;border-radius:1.25em;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 1.6em 2.8em rgba(5,8,40,.35)}
.card3d .front{transform:translateZ(3px)}
.card3d .back{transform:rotateY(180deg) translateZ(3px)}
.card3d .inner{position:relative;height:100%;padding:1.1em 1.25em;display:flex;flex-direction:column;justify-content:space-between}
.card3d .deco{position:absolute;right:-3.5em;bottom:-4.5em;width:13em;height:13em;opacity:.16}
.card3d .shop-name{font-family:var(--display);font-weight:800;font-size:1.15em;letter-spacing:-0.02em;line-height:1}
.card3d .kind{font-size:.62em;font-weight:600;opacity:.85;margin-top:.3em}
.card3d .count{font-family:var(--display);font-weight:800;font-size:2.8em;letter-spacing:-0.04em;line-height:.9}
.card3d .count small{font-family:var(--body);font-size:.27em;font-weight:600;letter-spacing:0;margin-left:.3em}
.card3d .stamps{display:flex;flex-wrap:wrap;gap:.32em}
.card3d .st{width:1.35em;height:1.35em;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.card3d .st svg{width:.8em;height:.8em}
.card3d .reward{font-size:.68em;font-weight:600}
.card3d .sheen{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,30%),rgba(255,255,255,var(--sh,.2)),rgba(255,255,255,0) 55%)}
.card3d .holo{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.5;background:linear-gradient(110deg,rgba(255,255,255,0) 20%,rgba(140,220,255,.55) 35%,rgba(255,170,240,.45) 45%,rgba(255,255,255,0) 60%);background-size:200% 100%;animation:holo 6s linear infinite}
@keyframes holo{to{background-position:200% 50%}}
.card3d .mark{display:inline-flex;align-items:baseline;font-family:var(--display);font-weight:800;font-size:1em;letter-spacing:-0.045em;line-height:1}
.card3d .mark svg{width:.56em;height:.56em;margin:0 .02em}
.card3d .back .inner{flex-direction:row;align-items:center;gap:1em;justify-content:flex-start}
.card3d .qr{background:#fff;border-radius:.6em;padding:.45em;flex:none}
.card3d .qr svg{width:6.2em;height:6.2em;display:block}
.card3d .who{font-family:var(--display);font-weight:800;font-size:1.15em;line-height:1.05}
.card3d .back p{margin:.35em 0 0;font-size:.62em;line-height:1.35}

/* Notifs (bannière) */
.banner{position:fixed;left:50%;top:14px;z-index:60;width:min(380px,calc(100% - 24px));background:rgba(255,255,255,.97);border-radius:20px;padding:12px 14px;box-shadow:0 16px 40px rgba(11,16,51,.25);display:flex;gap:10px;align-items:flex-start;transform:translate(-50%,-160%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.banner.show{transform:translate(-50%,0)}
.app-ico{width:36px;height:36px;border-radius:10px;background:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.app-ico svg{width:22px;height:22px}
.banner b{display:block;font-size:13px}
.banner p{margin:2px 0 0;font-size:13px;line-height:1.35}
.msg{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px}
.msg .t{font-size:12px;color:var(--ink-3);font-weight:600}
.wallet-btn{width:100%;min-height:50px;border-radius:14px;border:0;background:#000;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px}
.wallet-btn svg{width:22px;height:22px}
.prize{background:#FFF0C7;border-radius:16px;padding:12px 14px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center;border:0;width:100%;text-align:left}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}

/* Roue */
.wheel-wrap{position:relative;width:100%;max-width:280px;margin:0 auto;aspect-ratio:1}
.wheel-wrap canvas{width:100%;height:100%;display:block}
.wheel-pin{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid var(--coral);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.seg-row{display:grid;grid-template-columns:22px minmax(0,1fr) 92px 44px;gap:10px;align-items:center}
.dot{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(11,16,51,.2)}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center}
.icon-btn svg{width:18px;height:18px}

/* Fenêtre modale */
.modal{position:fixed;inset:0;z-index:50;background:rgba(7,11,36,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--bg);width:100%;max-width:440px;border-radius:28px;padding:24px 20px;display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,calc(100% + 40px));z-index:70;background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 12px 30px rgba(11,16,51,.3);transition:transform .35s cubic-bezier(.2,.8,.2,1);max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}

@media (max-width:480px){.hide-xs{display:none}.topbar{padding:10px 12px}}
@media (prefers-reduced-motion:reduce){
  .tilt-stage:not(.active) .card-float,.viewfinder .line,.card3d .holo,.auth-side .glow{animation:none}
  .card3d,.banner,.toast{transition:none}
}
.mob-id,.view-btn,.bnav{display:none}
.seg-views{display:flex}
@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .sidenav{display:none}
  .main{padding:20px 16px 48px}
  .layout.has-bnav .main{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
  .hide-sm{display:none}
  /* En-tête */
  .topbar{padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
  .desk-logo,.desk-only,.seg-views{display:none !important}
  .mob-id{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
  .mob-id b{display:block;font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mob-id small{display:block;font-size:12px;color:var(--ink-3);font-weight:600}
  .view-btn{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 8px 4px 4px;min-height:40px;flex:none}
  .view-btn svg{width:16px;height:16px;color:var(--ink-2)}
  /* Barre d'onglets en bas */
  .bnav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;min-height:56px;padding:4px 2px;border-radius:14px;color:var(--ink-3);font-size:11px;font-weight:600}
  .bn svg{width:23px;height:23px}
  .bn[aria-current="page"]{color:var(--blue-deep)}
  .bn[aria-current="page"] svg{stroke-width:2.4}
  .bn-scan{color:#fff !important}
  .bn-scan svg{width:26px;height:26px;padding:12px;box-sizing:content-box;background:var(--blue);border-radius:18px;margin-top:-22px;border:4px solid var(--paper)}
  .bn-scan span{color:var(--ink-3)}
  .bn-scan[aria-current="page"] span{color:var(--blue-deep)}
  /* Titres et blocs */
  .page-head{align-items:flex-start}
  .page-head h1{font-size:28px}
  .page-head p{font-size:14px}
  .page-head > .btn{width:100%}
  .panel{padding:18px;border-radius:20px}
  .grid-kpi{gap:10px}
  .kpi{padding:14px}
  .kpi .v{font-size:28px}
  .viewfinder{height:170px}
  /* Ma carte : l'aperçu d'abord */
  .card-grid > section:last-child{order:-1;padding:6px 10px 14px}
  /* Roue : un lot par ligne, le poids dessous */
  .seg-row{grid-template-columns:22px minmax(0,1fr) 44px;grid-template-areas:"dot label del" ". weight weight";row-gap:6px}
  .seg-row > .dot{grid-area:dot}.seg-row > input{grid-area:label}.seg-row > div{grid-area:weight}.seg-row > button{grid-area:del}
  .seg-row > div::before{content:"Chances";font-size:13px;font-weight:600;color:var(--ink-3);margin-right:6px}
  .seg-row > div input{max-width:90px}
  /* Feuilles du bas */
  .modal{align-items:flex-end;padding:0}
  .sheet{max-width:none;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom))}
}
.sheet-grab{width:44px;height:5px;border-radius:99px;background:#C9D1EE;margin:4px auto 2px}
.sheet-list{display:flex;flex-direction:column;gap:8px}
.sheet-item{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:12px 14px;min-height:60px;color:var(--ink)}
.sheet-item[aria-current="page"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.sheet-item b{display:block;font-size:15px}
.sheet-item small{display:block;font-size:13px;color:var(--ink-2);margin-top:1px}
.si-ico{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--blue-deep);display:flex;align-items:center;justify-content:center;flex:none}
.si-ico svg{width:20px;height:20px}
/* Tableaux en cartes sur téléphone */
@media (max-width:700px){
  .table-wrap:has(.m-cards){overflow:visible}
  table.m-cards{min-width:0;display:block}
  table.m-cards thead{display:none}
  table.m-cards tbody{display:flex;flex-direction:column;gap:10px}
  table.m-cards tr{display:grid;gap:8px 12px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px}
  table.m-cards td{display:block;padding:0;border:0;min-width:0}
  table.m-cards td[data-l]::before{content:attr(data-l);display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-bottom:2px}
  .m-cust tr{grid-template-columns:1fr 1fr;grid-template-areas:"name status" "stamps stamps" "visits last" "notif wallet"}
  .m-cust .c-name{grid-area:name;font-size:16px;align-self:center}
  .m-cust .c-status{grid-area:status;justify-self:end;text-align:right;display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
  .m-cust .c-stamps{grid-area:stamps}.m-cust .c-stamps .bar{flex:1;width:auto !important}
  .m-cust .c-visits{grid-area:visits}.m-cust .c-last{grid-area:last}
  .m-cust .c-notif{grid-area:notif}.m-cust .c-wallet{grid-area:wallet}
  .m-ten tr{grid-template-columns:1fr 1fr 1fr;grid-template-areas:"name name status" "shops cards mrr" "act act act"}
  .m-ten .t-name{grid-area:name}.m-ten .t-status{grid-area:status;justify-self:end}
  .m-ten .t-shops{grid-area:shops}.m-ten .t-cards{grid-area:cards}.m-ten .t-mrr{grid-area:mrr}
  .m-ten .t-act{grid-area:act}.m-ten .t-act .btn{width:100%}
}
.toast{pointer-events:none;visibility:hidden}
.toast.show{visibility:visible}
.banner{visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s linear .45s}
.banner.show{visibility:visible;transition:transform .45s cubic-bezier(.2,.8,.2,1)}

function qrSVG(seed){
  var n=21,out="",s=seed||7;function r(){s=(s*1103515245+12345)%2147483648;return s/2147483648;}
  for(var y=0;y<n;y++){for(var x=0;x<n;x++){var on,tl=y<7&&x<7,tr=y<7&&x>13,bl=y>13&&x<7;

    '<div class="face back" style="background:'+col.back+';color:'+col.backFg+'"><div class="inner"><div class="qr">'+qrSVG(hash(seedStr||t.id))+'</div><div><div class="who">'+esc(who||"Ton nom")+'</div><p>Montre ce QR en caisse pour gagner ton tampon.</p><p style="opacity:.75">QR de démonstration</p></div></div></div>'+
    '</div></div></div>';
}
function bindTilt(root){
  (root||document).querySelectorAll(".tilt-stage").forEach(function(st){
    if(st.dataset.bound)return;st.dataset.bound="1";
    var card=st.querySelector(".card3d"),flipped=false;
    st.addEventListener("pointermove",function(e){var r=st.getBoundingClientRect(),px=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),py=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
      st.classList.add("active");card.style.setProperty("--ry",((px-.5)*38).toFixed(1)+"deg");card.style.setProperty("--rx",(-(py-.5)*28).toFixed(1)+"deg");card.style.setProperty("--mx",(px*100).toFixed(0)+"%");card.style.setProperty("--my",(py*100).toFixed(0)+"%");card.style.setProperty("--sh",".45");});
    st.addEventListener("pointerleave",function(){st.classList.remove("active");["--rx","--ry","--mx","--my","--sh"].forEach(function(p){card.style.removeProperty(p);});});
    function flip(){flipped=!flipped;card.style.setProperty("--flip",flipped?"180deg":"0deg");}
    st.addEventListener("click",flip);
    st.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();}});
  });
}

var WC=[["#2F5BFF","#FFFFFF"],["#FFD166","#0B1033"],["#0B1033","#FFFFFF"],["#FF6A4D","#0B1033"],["#B9CBFF","#0B1033"]];
function drawWheel(cv,segs,rot){
  if(!cv)return;var dpr=window.devicePixelRatio||1,size=cv.clientWidth||260;cv.width=size*dpr;cv.height=size*dpr;
  var x=cv.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);var c=size/2,R=size/2-4,n=segs.length,a=2*Math.PI/n;
  x.clearRect(0,0,size,size);x.beginPath();x.arc(c,c,R+2,0,2*Math.PI);x.fillStyle="#0B1033";x.fill();
  for(var i=0;i<n;i++){var k=WC[i%WC.length];x.beginPath();x.moveTo(c,c);x.arc(c,c,R-2,rot+i*a,rot+(i+1)*a);x.closePath();x.fillStyle=k[0];x.fill();
    x.save();x.translate(c,c);x.rotate(rot+(i+.5)*a);x.textAlign="right";x.textBaseline="middle";x.fillStyle=k[1];x.font="700 "+Math.max(10,Math.round(size/22))+"px Inter, sans-serif";
    var l=segs[i].label||"…";if(l.length>18)l=l.slice(0,17)+"…";x.fillText(l,R-14,0);x.restore();}
  x.beginPath();x.arc(c,c,R*.16,0,2*Math.PI);x.fillStyle="#FFFFFF";x.fill();x.lineWidth=4;x.strokeStyle="#0B1033";x.stroke();
}
function pick(segs){var tot=segs.reduce(function(s,x){return s+Math.max(0,+x.w||0);},0)||1,r=Math.random()*tot;for(var i=0;i<segs.length;i++){r-=Math.max(0,+segs[i].w||0);if(r<=0)return i;}return segs.length-1;}
function spin(cv,segs,ref,done){
  var n=segs.length,a=2*Math.PI/n,idx=pick(segs),target=-Math.PI/2-(idx+.5)*a,start=ref.v,delta=((target-start)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  var red=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches,end=start+delta+(red?0:10*Math.PI),dur=red?500:4200,t0=null;
  function step(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-p,3);ref.v=start+(end-start)*e;drawWheel(cv,segs,ref.v);if(p<1)requestAnimationFrame(step);else done(idx);}
  requestAnimationFrame(step);
}

var bannerT;
function notify(card,title,body){

function showBanner(shop,title,body){var b=$("banner");b.innerHTML='<span class="app-ico">'+BOOM("#FFFFFF")+'</span><div><b>'+esc(shop)+' · '+esc(title)+'</b><p>'+esc(body)+'</p></div>';b.classList.add("show");clearTimeout(bannerT);bannerT=setTimeout(function(){b.classList.remove("show");},4500);}

function addStamp(card){
  var t=tenant(card.tenantId);if(card.ready)return;
  card.stamps++;card.visits++;card.lastDays=0;t.visits++;t.weeks[t.weeks.length-1]++;
  var g=t.card.goal,left=g-card.stamps;if(card.stamps>=g){card.stamps=g;card.ready=true;}
  activity(t.id,card.name+" a reçu un tampon ("+card.stamps+"/"+g+")");
  if(card.ready)notify(card,"Récompense prête","Bravo ! "+t.card.reward+" t'attend. Montre ta carte en caisse.");
  else if(t.scen.near&&left===2)notify(card,"Presque !","Plus que 2 passages et "+t.card.reward.toLowerCase()+" est pour toi.");
  else notify(card,"Tampon ajouté","Merci ! Tu en es à "+card.stamps+"/"+g+".");
  if(t.scen.review&&card.visits===1)notify(card,"Ton avis compte","Ça t'a plu ? Un avis Google nous aide beaucoup. Sans obligation et sans contrepartie.");
  save();toast("Tampon ajouté pour "+card.name+" · "+card.stamps+"/"+g+(card.customerUserId?" · notification envoyée":""));render();
}
function redeem(card){var t=tenant(card.tenantId);card.ready=false;card.stamps=0;t.rewards++;activity(t.id,card.name+" a utilisé sa récompense");notify(card,"Récompense utilisée","Profite bien ! Ta carte repart à zéro.");save();toast("Récompense validée pour "+card.name);render();}

function chart(t){
  var w=560,h=200,pl=34,pb=26,max=Math.max(80,Math.ceil(Math.max.apply(null,t.weeks)/20)*20),n=t.weeks.length,bw=(w-pl-10)/n,step=max/4;
  var s='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Passages par semaine sur 8 semaines, dernière semaine '+t.weeks[n-1]+'">';
  for(var k=0;k<=4;k++){var v=k*step,y=h-pb-(v/max)*(h-pb-12);s+='<line x1="'+pl+'" x2="'+w+'" y1="'+y+'" y2="'+y+'" stroke="#DCE3FA"/><text x="'+(pl-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#5F6890" font-family="Inter">'+v+'</text>';}
  t.weeks.forEach(function(v,i){var bh=(v/max)*(h-pb-12),x=pl+6+i*bw,y=h-pb-bh,last=i===n-1;s+='<rect x="'+x+'" y="'+y+'" width="'+(bw-12)+'" height="'+Math.max(bh,0)+'" rx="6" fill="'+(last?"#2F5BFF":"#B9CBFF")+'"/><text x="'+(x+(bw-12)/2)+'" y="'+(h-8)+'" text-anchor="middle" font-size="11" fill="#5F6890" font-family="Inter">S'+(i+1)+'</text>'+(last?'<text x="'+(x+(bw-12)/2)+'" y="'+(y-6)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#0B1033" font-family="Inter">'+v+'</text>':'');});
  return s+'</svg>';
}

    var txt=JSON.stringify(data,null,2);if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){toast("Tes données sont copiées");},function(){toast("Copie impossible ici");});}else toast("Copie impossible ici");return;}
  if(t.id==="delete-acc"){modal('<h2>Supprimer ton compte ?</h2><p style="margin:0">Tes '+myCustomerCards().length+' cartes et tes messages seront effacés. Les commerces ne pourront plus te contacter. C\'est définitif.</p><button type="button" class="btn btn-danger" id="delete-yes">Oui, tout supprimer</button><button type="button" class="btn btn-soft" data-close>Annuler</button>');return;}
  if(t.id==="delete-yes"){var uid0=me().id,ids=myCustomerCards().map(function(c){return c.id;});DB.cards=DB.cards.filter(function(c){return c.customerUserId!==uid0;});DB.notifs=DB.notifs.filter(function(n){return ids.indexOf(n.cardId)<0;});DB.users=DB.users.filter(function(u){return u.id!==uid0;});DB.session=null;save();closeModal();toast("Compte supprimé");render();return;}
});
document.addEventListener("input",function(e){
  var t=e.target,mt=me()&&myTenant();
  if(mt&&can("tenant.settings")){
    if(t.id==="c-name"){mt.name=t.value||"Mon commerce";save();renderPreview();return;}
    if(t.id==="c-reward"){mt.card.reward=t.value||"Une récompense";save();renderPreview();return;}
    if(t.id==="c-goal"){mt.card.goal=+t.value;$("goal-out").textContent=t.value;tenantCards(mt.id).forEach(function(c){if(c.stamps>=mt.card.goal){c.stamps=mt.card.goal;c.ready=true;}else c.ready=false;});save();renderPreview();return;}
    if(t.id==="c-address"){mt.address=t.value;save();return;}
    if(t.id==="c-geotext"){mt.geoText=t.value;save();return;}
    if(t.dataset.segL!==undefined){mt.wheel.segments[+t.dataset.segL].label=t.value;save();drawWheel($("wheel-prev"),mt.wheel.segments,prevRot.v);return;}
    if(t.dataset.segW!==undefined){mt.wheel.segments[+t.dataset.segW].w=Math.max(0,Math.min(100,+t.value||0));var tot=mt.wheel.segments.reduce(function(s,x){return s+x.w;},0)||1;mt.wheel.segments.forEach(function(s,i){var p=$("sp-"+i);if(p)p.textContent=Math.round(s.w/tot*100)+"%";});save();return;}
  }
  if(t.id==="jp-name"){UI.join.name=t.value;return;}
  if(t.id==="jp-contact"){UI.join.contact=t.value;return;}
  if(t.id==="scan-search"){UI.scanFilter=t.value;$("scan-list").innerHTML=scanRows(myTenant());return;}
  if(t.id==="client-search"){UI.clientFilter=t.value;$("client-body").innerHTML=custRows(myTenant());return;}
});
document.addEventListener("change",function(e){
  var t=e.target,mt=me()&&myTenant();
  if(t.id==="switch"&&t.value){var u=DB.users.filter(function(x){return x.id===t.value;})[0];if(u){login(u);toast("Connecté en tant que "+ROLE_LABEL[u.role]+" · "+(u.tenantId?tenant(u.tenantId).name:u.name));}return;}
  if(t.name==="card-color"&&can("tenant.settings")){mt.card.color=t.value;save();render();return;}
  if(t.id==="c-geo"&&can("tenant.settings")){mt.geoOn=t.checked;save();return;}
  if(t.name==="w-trig"&&can("tenant.settings")){mt.wheel.trigger=t.value;save();return;}
  if(t.dataset.scen&&can("tenant.campaigns")){mt.scen[t.dataset.scen]=t.checked;save();toast((t.checked?"Activé : ":"Désactivé : ")+t.getAttribute("aria-label"));return;}
  if(t.dataset.shops&&can("platform.view")){tenant(t.dataset.shops).shops=Math.max(1,Math.min(50,+t.value||1));save();toast("Nombre de boutiques modifié");render();return;}
  if(t.id==="b-shops"&&can("tenant.billing")){myTenant().shops=Math.max(1,Math.min(50,+t.value||1));save();render();return;}
  if(t.dataset.consent&&can("customer.cards")){var c=DB.cards.filter(function(x){return x.id===t.dataset.consent&&x.customerUserId===me().id;})[0];if(c){c.consent=t.checked;save();toast(t.checked?"Notifications activées":"Notifications coupées");}return;}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("modal").innerHTML){closeModal();render();}});
window.addEventListener("resize",function(){if(UI.tab==="card")renderPreview();if(UI.tab==="wheel"&&$("wheel-prev"))drawWheel($("wheel-prev"),myTenant().wheel.segments,prevRot.v);});

render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(UI.tab==="wheel"&&$("wheel-prev"))drawWheel($("wheel-prev"),myTenant().wheel.segments,prevRot.v);});
})();
</script>
</body>
</html>
